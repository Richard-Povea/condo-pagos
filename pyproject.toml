[project]
name = "condo-pagos"
version = "0.1.0"
description = "Registro de pagos de gastos comunes y comprobantes PDF"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0.30",
    "keyring>=25.7.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.3",
    "qrcode[pil]>=8.2",
    "reportlab>=4.2",
]

[project.gui-scripts]
condo-pagos = "condo_pagos.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov",
    "hypothesis>=6.0.0",
    "pypdf>=4",
    "ruff",
    "mypy",
    "types-qrcode",
    "types-reportlab",
    "import-linter>=2",
    "alembic>=1.13",
    "pytest-repeat>=0.9.4",
    "pytest-randomly>=3.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requiere PostgreSQL (docker compose --profile test up -d db_test)",
    "unit: Tests unitarios de lógica y componentes",
    "integration: Tests que involucran base de datos o adaptadores reales",
]

[tool.ruff]
exclude = [
    "src/condo_pagos/ui/strings.py"
]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.importlinter]
root_package = "condo_pagos"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas de Clean Architecture"
type = "layers"
layers = [
    "condo_pagos.ui | condo_pagos.infrastructure",
    "condo_pagos.use_cases",
    "condo_pagos.domain",
]

[[tool.importlinter.contracts]]
name = "Dominio y casos de uso no conocen frameworks"
type = "forbidden"
source_modules = ["condo_pagos.domain", "condo_pagos.use_cases"]
forbidden_modules = ["PySide6", "sqlalchemy", "psycopg", "reportlab"]

[[tool.importlinter.contracts]]
name = "La raíz de composición solo la importa main y los tests"
type = "forbidden"
source_modules = [
    "condo_pagos.ui",
    "condo_pagos.domain",
    "condo_pagos.use_cases",
    "condo_pagos.infrastructure",
]
forbidden_modules = ["condo_pagos.bootstrap"]

[[tool.importlinter.contracts]]
name = "La UI no importa infraestructura; consume contratos y ViewModels"
type = "forbidden"
source_modules = [
    "condo_pagos.ui.views.pagos_view",
    "condo_pagos.ui.views.registrar_pago_view",
    "condo_pagos.ui.views.unidades_view",
    "condo_pagos.ui.components.base",
    "condo_pagos.ui.components.tabla_base",
    "condo_pagos.ui.components.tabla_pagos",
    "condo_pagos.ui.components.tabla_unidades",
]
forbidden_modules = [
    "condo_pagos.infrastructure",
    "condo_pagos.bootstrap",
    "condo_pagos.domain",
    "condo_pagos.use_cases",
    "condo_pagos.ui.ports",
    "condo_pagos.ui.services",
    "condo_pagos.ui.composition",
]
