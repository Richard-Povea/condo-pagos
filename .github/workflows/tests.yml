name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: condo_test
          POSTGRES_PASSWORD: condo_test_pw
          POSTGRES_DB: condo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condo_test -d condo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CONDO_TEST_DATABASE_URL: postgresql+psycopg://condo_test:condo_test_pw@localhost:5432/condo_test
      DATABASE_URL: postgresql+psycopg://condo_test:condo_test_pw@localhost:5432/condo_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar bibliotecas Qt para pruebas headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Instalar dependencias
        run: uv sync --python 3.13 --group dev
      - name: Suite con orden aleatorio (semilla 1)
        run: uv run --python 3.13 pytest --randomly-seed=20261022
      - name: Suite con orden aleatorio (semilla 2)
        run: uv run --python 3.13 pytest --randomly-seed=781234
